# The dsh-plugin-dayflow bundle patch.
#
# A profile selects this bundle by name in `dsh.profile.bundles`; the entries
# below are inserted over the composition built so far. Address the row by id
# from your own `cordis.patch.yml` to change it:
#
#   - id: dayflow
#     config:
#       edits: false
#
# Row order carries no load semantics: activation follows service availability.
- insert:
    - id: dayflow
      name: dsh-plugin-dayflow
      config:
        # Absolute path to chunks.sqlite. Empty uses the app's location.
        databasePath: ''
        # Read backend: set source: owned (or dayflow: false) after importing.
        # Omitting both keeps the original Dayflow backend.
        # Absolute path to the owned journal. Empty uses $DSH_HOME/dayflow/journal.sqlite.
        journalPath: ''
        # Path to the app's write socket. Empty uses agent.sock beside the database.
        agentSocket: ''
        # Register the editing tools. Dayflow's own "Allow edits" switch still
        # gates every write, so this only decides whether the tools exist.
        edits: true
        # Register the bundled Dayflow, onboarding, standup, and weekly-review skills.
        skills: true
        # Expose the optional Web panel (header button + right-Sidebar tab).
        panel: true
        # Fetch site favicons for the panel cards; false makes no outbound request.
        icons: true
        # Register the Dayflow installer tool. Off by default: it changes this Mac.
        allowInstall: false
        # Maximum matches one dayflow_search call returns (1-200).
        searchLimit: 50
