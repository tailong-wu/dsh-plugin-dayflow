name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS is required: the preference-reading tests exercise `defaults`.
    # macOS 14 was retired by GitHub on 2026-11-02; macos-15 is supported.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
          # node:sqlite exists on 22 but needs the flag until Node 23.4.
          - node: 22
            node-options: --experimental-sqlite
    env:
      NODE_OPTIONS: ${{ matrix.node-options }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the package contents
        run: npm pack --dry-run

  release-check:
    # A release tag must name exactly the version in package.json.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${expected}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches ${expected}"
